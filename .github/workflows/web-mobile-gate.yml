name: Web + Android Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "data/**"
      - "tools/**"
      - ".github/actions/setup-godot/**"
      - ".github/workflows/web-mobile-gate.yml"
  pull_request:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "data/**"
      - "tools/**"
      - ".github/actions/setup-godot/**"
      - ".github/workflows/web-mobile-gate.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [web, android]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - if: matrix.target == 'android'
        name: Install Android export dependencies
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - if: matrix.target == 'android'
        name: Reuse test signing key
        uses: actions/cache@v4
        with:
          path: ~/.cache/bramble/debug.keystore
          key: bramble-android-test-key-v1
      - name: Build and validate
        run: python3 tools/build_game.py --target "${{ matrix.target }}"
      - if: matrix.target == 'web'
        name: Install runtime capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
      - if: matrix.target == 'web'
        name: Capture native production runtime
        run: |
          rm -f artifacts/live/latest_landscape.png artifacts/live/latest_portrait.png artifacts/live/latest_gameplay.png
          timeout 180 xvfb-run -a "$GODOT_BIN" --audio-driver Dummy --path . -- --live-capture gameplay
          python3 - <<'PY'
          from pathlib import Path
          for name in ('latest_landscape.png', 'latest_portrait.png', 'latest_gameplay.png'):
              file = Path('artifacts/live') / name
              assert file.is_file() and file.stat().st_size > 0, file
          PY
      - name: Upload ready build
        uses: actions/upload-artifact@v4
        with:
          name: bramble-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/bramble-web.zip
            build/web/**
            build/android/Bramble.apk
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 30
      - if: always()
        name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bramble-${{ matrix.target }}-diagnostics-${{ github.sha }}
          path: |
            build/logs/**
            artifacts/live/latest_*.png
          if-no-files-found: ignore
          retention-days: 14
